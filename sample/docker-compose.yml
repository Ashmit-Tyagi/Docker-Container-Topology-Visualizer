services:
  web:
    image: nginx
    ports:
      - "80:80"
    networks:
      - app-network
    volumes:
      - ./html:/usr/share/nginx/html
    depends_on:
      - backend

  backend:
    image: python:3.11
    ports:
      - "5000:5000"
    networks:
      - app-network
    volumes:
      - ./backend:/app
    depends_on:
      - db

  db:
    image: postgres
    ports:
      - "5432:5432"
    networks:
      - app-network
    volumes:
      - db-data:/var/lib/postgresql/data

networks:
  app-network:

volumes:
  db-data: